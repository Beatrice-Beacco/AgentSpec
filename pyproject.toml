[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentspec"
version = "0.1.0"
dependencies = [
    "antlr4-python3-runtime==4.13",
    "langchain",
    "langchain-core",
    "langchain-text-splitters",
    "langchain_openai",
    "langchain_community",
    "langchain_experimental"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# LangChain 0.3 deprecates initialize_agent / AgentType, which this fork still
# uses. Silenced so a real warning stays visible; revisit if we migrate to LCEL.
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
